<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<title>Moja strona</title>
		<link rel="stylesheet" href="style.css" />

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				display: flex;
				flex-direction: column; /* ustawia elementy jeden pod drugim */
				justify-content: center; /* wyśrodkowanie pionowe */
				align-items: center; /* wyśrodkowanie poziome */
				background-color: #9591e3;
			}

			h1 {
				font-size: 48px;
				text-align: center;
			}

			p {
				font-size: 24px;
				text-align: center;
			}

			img {
				width: 400px;
				height: auto;
				margin-bottom: 20px;
			}
		</style>
	</head>
	<body>
		<audio id="muzyka" loop>
			<source src="music2.mp3" type="audio/mpeg" />
			Twoja przeglądarka nie obsługuje elementu audio.
		</audio>
		<script>
			document.addEventListener('click', function startOnce() {
				const audio = document.getElementById('muzyka')
				audio.play()
				document.removeEventListener('click', startOnce) // tylko raz
			})
		</script>
		<h1 class="uzytkownik">Pyt #1</h1>
		<p class="o-tekst">Który z tych dżentelmenów to William Afton?</p>

		<div class="rzad">
			<div class="element">
				<img src="Purple_man.webp" alt="Purple Man" />
				<button onclick="window.location.href='2.html';">nr1</button>
			</div>
			<div class="element">
				<img src="william.webp" alt="William" />
				<button onclick="window.location.href='quit.html';">nr2</button>
			</div>
		</div>
	</body>
</html>
