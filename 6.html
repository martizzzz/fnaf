<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<title>Moja strona</title>
		<link rel="stylesheet" href="style.css" />

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				display: flex;
				flex-direction: column; /* ustawia elementy jeden pod drugim */
				justify-content: center; /* wyśrodkowanie pionowe */
				align-items: center; /* wyśrodkowanie poziome */
				background-color: #e6c9c9;
			}

			h1 {
				font-size: 48px;
				text-align: center;
			}

			p {
				font-size: 24px;
				text-align: center;
			}

			img {
				width: 400px;
				height: auto;
				margin-bottom: 20px;
			}
		</style>
	</head>
	<body>
		<audio id="muzyka" loop>
			<source src="music1.mp3" type="audio/mpeg" />
			Twoja przeglądarka nie obsługuje elementu audio.
		</audio>
		<script>
			document.addEventListener('click', function startOnce() {
				const audio = document.getElementById('muzyka')
				audio.play()
				document.removeEventListener('click', startOnce) // tylko raz
			})
		</script>

		<div class="indexbg"></div>
		<img src="freddy-raised-eyebrow.gif" />
		<h1 class="uzytkownik">GRATULACJE Użytkowniku</h1>
		<p class="o-tekst">Oto twa nagroda</p>

		<div class="rzad">
			<button
				class="play"
				onclick="window.location.href='https://youtu.be/itJ_DJVKAW0?t=40';">
				KLIKNIJ MNIE
			</button>
		</div>
	</body>
</html>
